# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-path-xpath"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-path-xpath"
description = "XPath path technology: reads and writes one value in an XML Stream by XPath 1.0, for promote, demote, route and process. A xmip-core-path technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The PathLanguage trait, the content a compiled path
# reads and the rewriting it writes live in path; the error in contract.
path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

# The estate's one XML reader: a document is read by codec's tree and only
# then built into the engine's model.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

# XPath 1.0 and the model it is written over, and nothing else: sxd-xpath
# evaluates over sxd-document's DOM alone, so the DOM is XPath's evaluation
# model, filled from codec's reader and never parsing text itself. Mutable,
# so a rewrite is a write and one serialization at the end. No other crate
# in the estate links either (test/ThirdParty.Test.ps1); the Schematron
# contract evaluates through this crate.
sxd-document = "0.3"
sxd-xpath = "0.4"

[dev-dependencies]
# The Stream fixture, for the tests only (ADR-0044).
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
